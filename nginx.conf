server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Inherited by locations that do not set their own add_header.
  include /etc/nginx/snippets/security-headers.conf;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/xml image/svg+xml application/javascript text/javascript application/json;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Written at container start by /docker-entrypoint.d/40-runtime-env.sh; no-store so a redeploy with new URLs shows at once.
  location = /env.js {
    root /tmp/runtime-env;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  location = /robots.txt {
    root /tmp/runtime-env;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Static files that SWA excludes from the SPA fallback: missing => 404.
  location ~* \.(png|jpe?g|gif|svg|webp|ico|pdf|css|js|woff2?|txt|xml|json)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
  }
}
