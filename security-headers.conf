add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
# CSP: script-src 'self' blocks injected and inline script (the XSS-to-token-theft chain). 'unsafe-inline' styles
# are needed for style attributes in rich text and UI libraries that inject <style>. connect/img allow any https origin until the final API,
# S3 and CDN domains are known; http://localhost:* keeps the image usable against a local API/MinIO.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https: http://localhost:*; media-src 'self' https:; connect-src 'self' https: http://localhost:*; frame-src 'self' https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
