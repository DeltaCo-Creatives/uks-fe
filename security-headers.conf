add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
# Switch off browser features the site never uses, and isolate the window from cross-origin pages (pentest 2026-10-21).
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# CSP (enforced): script-src 'self' blocks injected and inline script (the XSS-to-token-theft chain). Styles: <style> and
# stylesheets only from 'self' (style-src); inline style="" attributes stay allowed (style-src-attr) because CMS rich text
# (text-align, highlight) carries them. Nothing on the site injects a <style> element: pdf.js uses constructable
# stylesheets and React style props go through the CSSOM, which CSP does not govern. Fonts are self-hosted, so no Google
# origin is allowed. img/media/connect/frame still allow any https origin until the production hosts are confirmed; the
# stricter policy below is sent as Report-Only so the browser console shows what it would block, without blocking anything.
# Keep this in sync with public/staticwebapp.config.json (Azure Static Web Apps).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' https:; connect-src 'self' https:; frame-src 'self' https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
# CSP (report-only candidate): the target once every host is confirmed. Hosts: file/image host (PDF iframe, images, phone PDF
# reader fetch), YouTube thumbnails, and the embeds the site uses (YouTube, Google Drive, Instagram, TikTok).
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://obj.pauddasmen.id https://i.ytimg.com; media-src 'self' https://obj.pauddasmen.id; connect-src 'self' https://obj.pauddasmen.id; frame-src 'self' https://obj.pauddasmen.id https://www.youtube-nocookie.com https://www.youtube.com https://drive.google.com https://www.instagram.com https://www.tiktok.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
